#!KAMAILIO

####### Defined Values #########

#!define MULTIDOMAIN 0

#!define FLT_ACC 1
#!define FLT_ACCMISSED 2
#!define FLT_ACCFAILED 3


####### Antifraud #########

# Only the voice platform's SIP trunk is allowed to place new calls; everything else
# reaching us out-of-dialog is scanner/spam traffic.
#!define TRUSTED_SIP_SUBNETS "192.0.2.0/24"

# Flood threshold: sustained >20 req/2s from one source gets banned.
#!define PIKE_SAMPLING_UNIT 2
#!define PIKE_REQS_DENSITY 20
#!define PIKE_REMOVE_LATENCY 120

# Repeated bad API keys from an otherwise-trusted source get banned too.
# (Ban duration itself is hardcoded to 86400 at each sht_setxs() call site:
# #!define tokens aren't substituted inside already-quoted strings.)
#!define APIKEY_FAIL_THRESHOLD 5

####### Env Vars #########

#!defenvs DB_URL
#!defenv MY_PUBLIC_IP

####### Network #########

listen=udp:0.0.0.0:5060 advertise MY_PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise MY_PUBLIC_IP:5060
alias=MY_PUBLIC_IP

disable_tcp=no
tcp_accept_no_cl=yes

####### Global Parameters #########

debug=2
log_stderror=yes
log_prefix="{$mt $hdr(CSeq) $ci} "
children=2

####### Modules Section ########

loadmodule "xlog.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "dialog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "uac.so"
loadmodule "http_client.so"
loadmodule "jansson.so"
loadmodule "db_sqlite.so"
loadmodule "pv.so"
loadmodule "ipops.so"
loadmodule "pike.so"
loadmodule "htable.so"
loadmodule "rtpengine.so"

####### Module Parameters ########

modparam("dialog", "db_url", DB_URL)
modparam("dialog", "dlg_flag", 10)

modparam("http_client", "connection_timeout", 2000)

modparam("rtpengine", "rtpengine_sock", "udp:172.28.0.1:22222")
# restore_dlg=1 keeps the original From/To in dialog vars. Without it the module
# falls back to a Record-Route parameter holding base64(originalURI XOR newURI),
# which the caller can undo with the URI it dialled -- i.e. the real callee and the
# carrier host travel back to the platform on every reply.
modparam("uac", "restore_dlg", 1)
modparam("uac", "auth_username_avp", "$avp(uac_user)")
modparam("uac", "auth_password_avp", "$avp(uac_pass)")
modparam("uac", "auth_realm_avp", "$avp(uac_realm)")

modparam("pike", "sampling_time_unit", PIKE_SAMPLING_UNIT)
modparam("pike", "reqs_density_per_unit", PIKE_REQS_DENSITY)
modparam("pike", "remove_latency", PIKE_REMOVE_LATENCY)

modparam("htable", "db_url", DB_URL)
# Persistent ban list (survives restarts, backed by the sqlite DB_URL).
# db_expires=1 is required so a ban's TTL survives the round-trip through the
# DB too -- otherwise reloaded bans come back with expires=0, i.e. permanent.
modparam("htable", "db_expires", 1)
# autoexpire (86400s) matches the ban duration used in sht_setxs() calls below.
modparam("htable", "htable", "ipban=>size=8;autoexpire=86400;dbtable=htable_ipban;dbmode=1;")
# Short-lived counter of bad-API-key attempts, per source IP (in-memory only).
modparam("htable", "htable", "apikeyfail=>size=8;autoexpire=300;")

####### Routing Logic ########

route {
    xlog("L_INFO", "MainRoute: [$ci] $rm from $si:$sp");

    route(REQINIT);

    if (is_method("CANCEL")) {
        if (t_check_trans())
            t_relay();
        exit;
    }

    if (!is_method("ACK")) {
        if(t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    route(WITHINDLG);

    remove_hf("Route");

    # Everything past this point is a new (out-of-dialog) request. The only
    # legitimate source is the voice platform SIP trunk -- anything else is
    # scanner/spam traffic and gets dropped silently.
    if (!is_in_subnet("$si", TRUSTED_SIP_SUBNETS)) {
        xlog("L_WARN", "ANTIFRAUD: untrusted source $si:$sp rm=$rm -> drop\n");
        drop();
    }

    if (is_method("INVITE")) {
        dlg_manage();
        $dlg_var(caller)      = $fU;
        $dlg_var(callee)      = $rU;
        $dlg_var(invite_time) = $TS;

        if ($hdr(Call-ID) != $null) {
            $dlg_var(platform_call_id) = $hdr(Call-ID);
            xlog("L_INFO", "MainRoute: Platform Call-ID=$dlg_var(platform_call_id)");
        }

        record_route();
        setflag(FLT_ACC);
        setflag(10);
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (!is_present_hf("X-API-Key")) {
        xlog("L_WARN", "Missing X-API-Key from $si:$sp\n");
        route(APIKEY_FAIL);
        sl_send_reply("403", "Forbidden - Missing Token");
        exit;
    }

    if ($hdr(X-API-Key) == $env(TRUNK_IPAUTH_API_KEY)) {
        xlog("L_INFO", "RealCall - IPAUTH src=$si dst=$rU");
        $var(source)         = "platform";
        $avp(acc_provider)   = "ipauth";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "ipauth";
        route(DETOKENIZE);
        route(TRUNK_IPAUTH);
    }

    if ($hdr(X-API-Key) == $env(TRUNK_DIGEST_API_KEY)) {
        xlog("L_INFO", "RealCall - DIGEST src=$si dst=$rU");
        $var(source)         = "platform";
        $avp(acc_provider)   = "digest";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "digest";
        route(DETOKENIZE);
        route(TRUNK_DIGEST);
    }

    if ($hdr(X-API-Key) == $env(TRUNK_DIRECT_API_KEY)) {
        xlog("L_INFO", "RealCall - DIRECT src=$si dst=$rU");
        $var(source)         = "platform";
        $avp(acc_provider)   = "direct";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "direct";
        route(DETOKENIZE);
        route(TRUNK_DIRECT);
    }

    xlog("L_WARN", "Unknown API key from $si\n");
    route(APIKEY_FAIL);
    sl_send_reply("403", "Forbidden - Invalid Token");
    exit;
}

# Counts repeated bad/missing API keys per source and raises an alert. Only the
# trusted subnet ever reaches this route (everything else is dropped earlier), and
# REQINIT deliberately never bans that subnet, so a ban here would be written and
# never enforced -- the alert is the whole point.
route[APIKEY_FAIL] {
    $var(apikeyfail_count) = $shtinc(apikeyfail=>$si);
    if ($var(apikeyfail_count) >= APIKEY_FAIL_THRESHOLD) {
        xlog("L_ALERT", "ANTIFRAUD: repeated bad API keys from $si (count=$var(apikeyfail_count))\n");
    }
}

# Per SIP request initial checks
route[REQINIT] {
    xlog("L_NOTICE", "REQINIT: $rm from $si");

    # Ban/flood enforcement never applies to our own known infra (the
    # platform trunk and the 3 outbound gateways) -- they can legitimately
    # send in-dialog traffic (ACK/BYE/replies) at high volume under load, and
    # a false-positive ban here would take down real calls for 24h.
    if (!is_in_subnet("$si", TRUSTED_SIP_SUBNETS)
            && $si != $env(TRUNK_IPAUTH_HOST)
            && $si != $env(TRUNK_DIGEST_HOST)
            && $si != $env(TRUNK_DIRECT_HOST)) {

        # Already-banned sources get dropped before any other processing.
        if ($sht(ipban=>$si) != $null) {
            drop();
        }

        # Flood detection: bans sources that exceed the configured request rate.
        if (!pike_check_req()) {
            xlog("L_ALERT", "ANTIFRAUD: flood detected from $si, banning\n");
            sht_setxs("ipban", "$si", "flood", "86400");
            drop();
        }
    }

    if ($ua =~ "friendly-scanner|sipcli|VaxSIPUserAgent|pplsip") {
        drop();
    }

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

route[RELAY] {
    xlog("L_INFO", "RELAY: [$ci] to $dd:$dp");

    if (is_method("INVITE")) {
        rtpengine_manage("replace-origin replace-session-connection");
        t_on_reply("MANAGE_REPLY");
        if (!t_is_set("failure_route")) {
            t_on_failure("MANAGE_FAILURE");
        }
    }

    if (!t_relay()) {
        sl_reply_error();
    }

    exit;
}

route[WITHINDLG] {
    xlog("L_INFO", "WITHINDLG: [$ci] $rm from $si");

    if (!has_totag()) return;
    dlg_manage();

    if (loose_route()) {
        if (is_method("BYE")) {
            rtpengine_delete();
            setflag(FLT_ACC);
            setflag(FLT_ACCFAILED);
            $avp(acc_status) = "success";
        } else if (is_method("NOTIFY")) {
            xlog("L_INFO", "NOTIFY from $si:$sp");
        }
        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
            exit;
        } else {
            exit;
        }
    }

    sl_send_reply("404", "Not here");
    exit;
}

# GET http://cabinet:3501/detokenize?t=<token>

route[DETOKENIZE] {
    if (!is_method("INVITE")) return;

    if ($rU =~ "^\+") {
        strip(1);
    }

    $var(detoken_url) = $_s($env(DETOKEN_URL)?t=$rU);
    xlog("L_INFO", "DETOKENIZE: GET $env(DETOKEN_URL) token=$rU");

    $var(http_rc) = http_client_query("$var(detoken_url)", "",
        "X-Decrypt-Key: $env(DECRYPT_KEY)",
        "$var(json_resp)");

    if ($var(http_rc) == 200) {
        jansson_get("phone", $var(json_resp), "$var(real_phone)");

        if ($var(real_phone) == $null || $var(real_phone) == "") {
            xlog("L_ERR", "DETOKENIZE: empty phone in response for token=$rU\n");
            sl_send_reply("603", "Declined");
            exit;
        }

        xlog("L_INFO", "DETOKENIZE: token=$dlg_var(callee) resolved");
        $rU = $var(real_phone);
        if ($rU =~ "^\+") {
            strip(1);
        }

    } else {
        xlog("L_ERR", "DETOKENIZE: HTTP error=$var(http_rc) token=$rU\n");
        sl_send_reply("603", "Declined");
        exit;
    }
}

route[COUNTRY] {
    $var(country) = "??";
    if ($rU =~ "^64")         { $var(country) = "NZ"; }
    else if ($rU =~ "^90")    { $var(country) = "TR"; }
    else if ($rU =~ "^41")    { $var(country) = "CH"; }
    else if ($rU =~ "^61")    { $var(country) = "AU"; }
    else if ($rU =~ "^54")    { $var(country) = "AR"; }
    else if ($rU =~ "^44")    { $var(country) = "GB"; }
    else if ($rU =~ "^49")    { $var(country) = "DE"; }
    else if ($rU =~ "^356")   { $var(country) = "MT"; }
    else if ($rU =~ "^48")    { $var(country) = "PL"; }
    else if ($rU =~ "^31")    { $var(country) = "NL"; }
    else if ($rU =~ "^998")   { $var(country) = "UZ"; }
    else if ($rU =~ "^7[67]") { $var(country) = "KZ"; }
    else if ($rU =~ "^7")     { $var(country) = "RU"; }
    else if ($rU =~ "^351")   { $var(country) = "PT"; }
    else if ($rU =~ "^34")    { $var(country) = "ES"; }
    else if ($rU =~ "^33")    { $var(country) = "FR"; }
    else if ($rU =~ "^380")   { $var(country) = "UA"; }
    else {
        xlog("L_WARN", "COUNTRY: unknown prefix for token=$dlg_var(callee)\n");
    }
}

route[TRUNK_IPAUTH] {
    route(COUNTRY);

    $var(dial_num) = $_s($env(TRUNK_IPAUTH_PREFIX)$rU);
    $var(ru_str)   = $_s(sip:$var(dial_num)@$env(TRUNK_IPAUTH_HOST):$env(TRUNK_IPAUTH_PORT));

    xlog("L_INFO", "IPAUTH: country=$var(country) token=$dlg_var(callee) gw=$env(TRUNK_IPAUTH_HOST):$env(TRUNK_IPAUTH_PORT)");

    $ru = $var(ru_str);
    uac_replace_to($var(ru_str));
    uac_replace_from("$fU", "sip:$fU@$env(MY_PUBLIC_IP):5060");

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    route(RELAY);
}

route[TRUNK_DIGEST] {
    route(COUNTRY);

    $var(ru_str) = $_s(sip:$rU@$env(TRUNK_DIGEST_HOST):$env(TRUNK_DIGEST_PORT));

    xlog("L_INFO", "DIGEST: country=$var(country) token=$dlg_var(callee) gw=$env(TRUNK_DIGEST_HOST):$env(TRUNK_DIGEST_PORT)");

    $ru = $var(ru_str);
    uac_replace_to($var(ru_str));
    uac_replace_from("$env(TRUNK_DIGEST_USER)", "sip:$env(TRUNK_DIGEST_USER)@$env(MY_PUBLIC_IP):5060");

    $avp(uac_user)  = $env(TRUNK_DIGEST_USER);
    $avp(uac_pass)  = $env(TRUNK_DIGEST_PASS);
    $avp(uac_realm) = "";

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    t_on_failure("MANAGE_FAILURE");

    route(RELAY);
}

route[TRUNK_DIRECT] {
    route(COUNTRY);

    $var(ru_str) = $_s(sip:$rU@$env(TRUNK_DIRECT_HOST):$env(TRUNK_DIRECT_PORT));

    xlog("L_INFO", "DIRECT: country=$var(country) token=$dlg_var(callee) gw=$env(TRUNK_DIRECT_HOST):$env(TRUNK_DIRECT_PORT)");

    $ru = $var(ru_str);
    uac_replace_to($var(ru_str));
    uac_replace_from("$fU", "sip:$fU@$env(MY_PUBLIC_IP):5060");

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    route(RELAY);
}

onreply_route[MANAGE_REPLY] {
    xlog("L_INFO", "MANAGE_REPLY: [$ci] status=$rs");

    if (has_body("application/sdp")) {
        rtpengine_manage("replace-origin replace-session-connection");
    }

    if ($rs =~ "^2[0-9][0-9]") {
        $dlg_var(answer_time) = $TS;
        $avp(acc_status)      = "answered";
    } else if ($rs =~ "^486") {
        $avp(acc_status) = "busy";
    } else if ($rs =~ "^4[0-9][0-9]") {
        $avp(acc_status) = "failed";
    }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        $avp(acc_status) = "no answer";
        setflag(FLT_ACCMISSED);
        exit;
    }
    if (t_check_status("401|407")) {
        uac_auth();
        t_relay();
        exit;
    }
    $avp(acc_status) = "failed";
}