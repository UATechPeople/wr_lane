#!KAMAILIO

#!define MULTIDOMAIN 0

#!define FLT_ACC 1
#!define FLT_ACCMISSED 2
#!define FLT_ACCFAILED 3


#!define PIKE_SAMPLING_UNIT 2
#!define PIKE_REQS_DENSITY 20
#!define PIKE_REMOVE_LATENCY 120

#!define APIKEY_FAIL_THRESHOLD 5

#!defenvs DB_URL
#!defenv MY_PUBLIC_IP

listen=udp:0.0.0.0:5060 advertise MY_PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise MY_PUBLIC_IP:5060
alias=MY_PUBLIC_IP

disable_tcp=no
tcp_accept_no_cl=yes

debug=2
log_stderror=yes
log_prefix="{$mt $hdr(CSeq) $ci} "
children=2
server_signature=no
user_agent_header="User-Agent: SIP"

loadmodule "xlog.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "dialog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "uac.so"
loadmodule "http_client.so"
loadmodule "jansson.so"
loadmodule "db_sqlite.so"
loadmodule "pv.so"
loadmodule "ipops.so"
loadmodule "pike.so"
loadmodule "htable.so"
loadmodule "rtpengine.so"
loadmodule "textopsx.so"

modparam("tm", "auto_inv_100_reason", "Trying")

modparam("dialog", "db_url", DB_URL)
modparam("dialog", "dlg_flag", 10)
modparam("dialog", "db_mode", 1)

modparam("http_client", "connection_timeout", 2000)

modparam("rtpengine", "rtpengine_sock", "udp:172.28.0.1:22222")
modparam("uac", "restore_dlg", 1)
modparam("uac", "auth_username_avp", "$avp(uac_user)")
modparam("uac", "auth_password_avp", "$avp(uac_pass)")
modparam("uac", "auth_realm_avp", "$avp(uac_realm)")

modparam("pike", "sampling_time_unit", PIKE_SAMPLING_UNIT)
modparam("pike", "reqs_density_per_unit", PIKE_REQS_DENSITY)
modparam("pike", "remove_latency", PIKE_REMOVE_LATENCY)

modparam("htable", "db_url", DB_URL)
modparam("htable", "db_expires", 1)
modparam("htable", "htable", "ipban=>size=8;autoexpire=86400;dbtable=htable_ipban;dbmode=1;")
modparam("htable", "htable", "apikeyfail=>size=8;autoexpire=300;")
modparam("htable", "htable", "goodsrc=>size=8;autoexpire=3600;")

route {
    xlog("L_INFO", "MainRoute: [$ci] $rm from $si:$sp\n");

    route(REQINIT);

    if (is_method("CANCEL")) {
        if (t_check_trans())
            t_relay();
        exit;
    }

    if (!is_method("ACK")) {
        if(t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    route(WITHINDLG);

    remove_hf("Route");

    if (is_method("INVITE")) {
        dlg_manage();
        $dlg_var(caller)      = $fU;
        $dlg_var(callee)      = $rU;
        $dlg_var(invite_time) = $TS;
        $dlg_var(a_tag)       = $ft;

        if ($hdr(Call-ID) != $null) {
            $dlg_var(platform_call_id) = $hdr(Call-ID);
            xlog("L_INFO", "MainRoute: Platform Call-ID=$dlg_var(platform_call_id)\n");
        }

        record_route();
        setflag(FLT_ACC);
        setflag(10);
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (!is_present_hf("X-API-Key")) {
        xlog("L_WARN", "Missing X-API-Key from $si:$sp -> drop\n");
        route(APIKEY_FAIL);
        drop();
    }

    if (!($hdr(X-API-Key) =~ "^[A-Za-z0-9_-]{16,128}$")) {
        xlog("L_WARN", "Malformed API key from $si\n");
        route(APIKEY_FAIL);
        sl_send_reply("403", "Forbidden");
        exit;
    }

    $var(key_rc) = http_client_query("$env(CABINET_INTERNAL_URL)/trunk-key", "",
        "X-Decrypt-Key: $env(DECRYPT_KEY)\r\nX-Trunk-Key: $hdr(X-API-Key)\r\nX-Source-IP: $si",
        "$var(key_resp)");
    if ($var(key_rc) == 403) {
        xlog("L_WARN", "TRUNK-KEY: $si is not an allowed SIP source for this cabinet\n");
        sl_send_reply("403", "Forbidden");
        exit;
    }
    if ($var(key_rc) != 200 && $var(key_rc) != 404) {
        xlog("L_ERR", "TRUNK-KEY: the cabinet did not answer (rc=$var(key_rc)); refusing without counting it against $si\n");
        sl_send_reply("503", "Service Unavailable");
        exit;
    }
    $var(key_mode) = "";
    $var(key_route) = "";
    $var(key_prefix) = "";
    if ($var(key_rc) == 200) {
        jansson_get("mode", $var(key_resp), "$var(key_mode)");
        jansson_get("route", $var(key_resp), "$var(key_route)");
        jansson_get("prefix", $var(key_resp), "$var(key_prefix)");
    }
    if ($var(key_prefix) == $null) $var(key_prefix) = "";

#!ifdef WITH_IPAUTH
    if ($var(key_mode) == "ipauth") {
        xlog("L_INFO", "RealCall - IPAUTH src=$si dst=$rU\n");
        $var(source)         = "platform";
        $avp(acc_provider)   = "ipauth";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "ipauth";
        $dlg_var(route)      = $var(key_route);
        $sht(goodsrc=>$si) = 1;
        route(DETOKENIZE);
        route(TRUNK_IPAUTH);
    }
#!endif

#!ifdef WITH_DIGEST
    if ($var(key_mode) == "digest") {
        xlog("L_INFO", "RealCall - DIGEST src=$si dst=$rU\n");
        $var(source)         = "platform";
        $avp(acc_provider)   = "digest";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "digest";
        $dlg_var(route)      = $var(key_route);
        $sht(goodsrc=>$si) = 1;
        route(DETOKENIZE);
        route(TRUNK_DIGEST);
    }
#!endif

#!ifdef WITH_DIRECT
    if ($var(key_mode) == "direct") {
        xlog("L_INFO", "RealCall - DIRECT src=$si dst=$rU\n");
        $var(source)         = "platform";
        $avp(acc_provider)   = "direct";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "direct";
        $dlg_var(route)      = $var(key_route);
        $sht(goodsrc=>$si) = 1;
        route(DETOKENIZE);
        route(TRUNK_DIRECT);
    }
#!endif

    xlog("L_WARN", "Unknown API key from $si\n");
    route(APIKEY_FAIL);
    sl_send_reply("403", "Forbidden");
    exit;
}

route[APIKEY_FAIL] {
    if ($sht(goodsrc=>$si) != $null) {
        xlog("L_WARN", "ANTIFRAUD: bad API key from $si, which sent a valid key within the hour; not banned\n");
        return;
    }
    $var(apikeyfail_count) = $shtinc(apikeyfail=>$si);
    if ($var(apikeyfail_count) >= APIKEY_FAIL_THRESHOLD) {
        xlog("L_ALERT", "ANTIFRAUD: repeated bad API keys from $si (count=$var(apikeyfail_count)), banning\n");
        sht_setxs("ipban", "$si", "badkey", "86400");
    }
}

route[REQINIT] {
    xlog("L_NOTICE", "REQINIT: $rm from $si\n");

    if ($sht(goodsrc=>$si) == $null
            && $si != $env(TRUNK_IPAUTH_HOST)
            && $si != $env(TRUNK_DIGEST_HOST)
            && $si != $env(TRUNK_DIRECT_HOST)) {

        if ($sht(ipban=>$si) != $null) {
            drop();
        }

        if (!pike_check_req()) {
            xlog("L_ALERT", "ANTIFRAUD: flood detected from $si, banning\n");
            sht_setxs("ipban", "$si", "flood", "86400");
            drop();
        }
    }

    if ($ua =~ "friendly-scanner|sipcli|VaxSIPUserAgent|pplsip") {
        drop();
    }

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

route[RELAY] {
    xlog("L_INFO", "RELAY: [$ci] to $dd:$dp\n");

    t_on_reply("MANAGE_REPLY");
    if (is_method("INVITE")) {
        rtpengine_manage("replace-origin replace-session-connection");
        if (!t_is_set("failure_route")) {
            t_on_failure("MANAGE_FAILURE");
        }
    }

    if (!t_relay()) {
        sl_reply_error();
    }

    exit;
}

route[WITHINDLG] {
    xlog("L_INFO", "WITHINDLG: [$ci] $rm from $si\n");

    if (!has_totag()) return;
    dlg_manage();

    if (!is_method("ACK|BYE") && !is_known_dlg()) {
        sl_send_reply("481", "Call/Transaction Does Not Exist");
        exit;
    }

    route(STRIP_IDENTITY);

    if ($rU == "hn-anon") {
        if ($dlg_var(b_contact) == $null) {
            if (!is_method("ACK")) {
                sl_send_reply("481", "Call/Transaction Does Not Exist");
            }
            exit;
        }
        $ru = $dlg_var(b_contact);
    } else if ($dlg_var(a_tag) == $null || $ft != $dlg_var(a_tag)) {
        route(HIDE_CONTACT);
        route(CLEAN_SDP);
    }

    if (loose_route()) {
        if (is_method("BYE")) {
            rtpengine_delete();
            setflag(FLT_ACC);
            setflag(FLT_ACCFAILED);
            $avp(acc_status) = "success";
        } else if (is_method("NOTIFY")) {
            xlog("L_INFO", "NOTIFY from $si:$sp\n");
        }
        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
            exit;
        } else {
            exit;
        }
    }

    sl_send_reply("404", "Not Found");
    exit;
}

route[DETOKENIZE] {
    if (!is_method("INVITE")) return;

    if ($rU =~ "^\+") {
        strip(1);
    }

    $var(detoken_url) = $_s($env(DETOKEN_URL)?t=$rU);
    xlog("L_INFO", "DETOKENIZE: GET $env(DETOKEN_URL) token=$rU\n");

    $var(http_rc) = http_client_query("$var(detoken_url)", "",
        "X-Decrypt-Key: $env(DECRYPT_KEY)",
        "$var(json_resp)");

    if ($var(http_rc) == 200) {
        jansson_get("phone", $var(json_resp), "$var(real_phone)");

        if ($var(real_phone) == $null || $var(real_phone) == "") {
            xlog("L_ERR", "DETOKENIZE: empty phone in response for token=$rU\n");
            sl_send_reply("603", "Decline");
            exit;
        }

        xlog("L_INFO", "DETOKENIZE: token=$dlg_var(callee) resolved\n");
        $rU = $var(real_phone);
        if ($rU =~ "^\+") {
            strip(1);
        }

    } else {
        xlog("L_ERR", "DETOKENIZE: HTTP error=$var(http_rc) token=$rU\n");
        sl_send_reply("603", "Decline");
        exit;
    }
}

route[HIDE_CONTACT] {
    if (is_present_hf("Contact")) {
        if ($rs == $null || $rs =~ "^2" || ($rs =~ "^1" && $dlg_var(b_contact) == $null)) {
            $dlg_var(b_contact) = $(ct{tobody.uri});
        }
        remove_hf("Contact");
        append_hf("Contact: <sip:hn-anon@$env(MY_PUBLIC_IP):5060>\r\n");
    }
}

route[CLEAN_SDP] {
    if (has_body("application/sdp")) {
        subst_body("/\r\no=[^ \r\n]+ /\r\no=- /");
        subst_body("/\r\ns=[^\r\n]*/\r\ns=-/");
        subst_body("/\r\ni=[^\r\n]*//g");
        msg_apply_changes();
    }
}

route[STRIP_IDENTITY] {
    remove_hf("P-Asserted-Identity");
    remove_hf("P-Preferred-Identity");
    remove_hf("Remote-Party-ID");
    remove_hf("P-Called-Party-ID");
    remove_hf("Diversion");
    remove_hf("History-Info");
    remove_hf("Warning");
    remove_hf("Server");
    remove_hf("User-Agent");
    remove_hf("Organization");
    remove_hf("Reason");
    remove_hf("Call-Info");
    remove_hf("Alert-Info");
    remove_hf("Referred-By");
    remove_hf_re("^([Pp]|[Xx])-");
}

#!ifdef WITH_IPAUTH
route[TRUNK_IPAUTH] {
    $var(dial_num) = $_s($var(key_prefix)$rU);
    $var(ru_str)   = $_s(sip:$var(dial_num)@$env(TRUNK_IPAUTH_HOST):$env(TRUNK_IPAUTH_PORT));

    xlog("L_INFO", "IPAUTH: route=$var(key_route) prefix=$var(key_prefix) token=$dlg_var(callee) gw=$env(TRUNK_IPAUTH_HOST):$env(TRUNK_IPAUTH_PORT)\n");

    $ru = $var(ru_str);
    uac_replace_to($var(ru_str));
    uac_replace_from("$fU", "sip:$fU@$env(MY_PUBLIC_IP):5060");

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    route(RELAY);
}
#!endif

#!ifdef WITH_DIGEST
route[TRUNK_DIGEST] {
    $var(dial_num) = $_s($var(key_prefix)$rU);
    $var(ru_str) = $_s(sip:$var(dial_num)@$env(TRUNK_DIGEST_HOST):$env(TRUNK_DIGEST_PORT));

    xlog("L_INFO", "DIGEST: token=$dlg_var(callee) gw=$env(TRUNK_DIGEST_HOST):$env(TRUNK_DIGEST_PORT)\n");

    $ru = $var(ru_str);
    uac_replace_to($var(ru_str));
    uac_replace_from("$env(TRUNK_DIGEST_USER)", "sip:$env(TRUNK_DIGEST_USER)@$env(MY_PUBLIC_IP):5060");

    $avp(uac_user)  = $env(TRUNK_DIGEST_USER);
    $avp(uac_pass)  = $env(TRUNK_DIGEST_PASS);
    $avp(uac_realm) = "";

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    t_on_failure("MANAGE_FAILURE");

    route(RELAY);
}
#!endif

#!ifdef WITH_DIRECT
route[TRUNK_DIRECT] {
    $var(dial_num) = $_s($var(key_prefix)$rU);
    $var(ru_str) = $_s(sip:$var(dial_num)@$env(TRUNK_DIRECT_HOST):$env(TRUNK_DIRECT_PORT));

    xlog("L_INFO", "DIRECT: token=$dlg_var(callee) gw=$env(TRUNK_DIRECT_HOST):$env(TRUNK_DIRECT_PORT)\n");

    $ru = $var(ru_str);
    uac_replace_to($var(ru_str));
    uac_replace_from("$fU", "sip:$fU@$env(MY_PUBLIC_IP):5060");

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    route(RELAY);
}
#!endif

onreply_route[MANAGE_REPLY] {
    xlog("L_INFO", "MANAGE_REPLY: [$ci] status=$rs\n");

    if ($dlg_var(a_tag) == $null || $ft == $dlg_var(a_tag)) {
        route(HIDE_CONTACT);
    }

    if (has_body("application/sdp")) {
        route(CLEAN_SDP);
        rtpengine_manage("replace-origin replace-session-connection");
    }

    if (is_method("INVITE")) {
        if ($rs =~ "^2[0-9][0-9]") {
            $dlg_var(answer_time) = $TS;
            $avp(acc_status)      = "answered";
        } else if ($rs =~ "^486") {
            $avp(acc_status) = "busy";
        } else if ($rs =~ "^4[0-9][0-9]") {
            $avp(acc_status) = "failed";
        }
    }

    route(STRIP_IDENTITY);
    if ($rs == 100) { change_reply_status("100", "Trying"); }
    else if ($rs == 180) { change_reply_status("180", "Ringing"); }
    else if ($rs == 183) { change_reply_status("183", "Session Progress"); }
    else if ($rs =~ "^1") { change_reply_status("$rs", "Progress"); }
    else if ($rs =~ "^2") { change_reply_status("$rs", "OK"); }
    else if ($rs == 403) { change_reply_status("403", "Forbidden"); }
    else if ($rs == 404) { change_reply_status("404", "Not Found"); }
    else if ($rs == 408) { change_reply_status("408", "Request Timeout"); }
    else if ($rs == 480) { change_reply_status("480", "Temporarily Unavailable"); }
    else if ($rs == 484) { change_reply_status("484", "Address Incomplete"); }
    else if ($rs == 486) { change_reply_status("486", "Busy Here"); }
    else if ($rs == 487) { change_reply_status("487", "Request Terminated"); }
    else if ($rs =~ "^4") { change_reply_status("$rs", "Request Failed"); }
    else if ($rs == 503) { change_reply_status("503", "Service Unavailable"); }
    else if ($rs =~ "^5") { change_reply_status("$rs", "Server Error"); }
    else if ($rs == 600) { change_reply_status("600", "Busy Everywhere"); }
    else if ($rs == 603) { change_reply_status("603", "Decline"); }
    else if ($rs =~ "^6") { change_reply_status("$rs", "Global Failure"); }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        $avp(acc_status) = "no answer";
        setflag(FLT_ACCMISSED);
        exit;
    }
    if (t_check_status("401|407")) {
        uac_auth();
        t_on_reply("MANAGE_REPLY");
        t_relay();
        exit;
    }
    $avp(acc_status) = "failed";
    if (t_check_status("3[0-9][0-9]")) {
        t_reply("480", "Temporarily Unavailable");
        exit;
    }
}