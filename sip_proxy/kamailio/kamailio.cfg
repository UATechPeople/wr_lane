route[PROTON]{

    if ($rU =~ "^64")       { $var(country) = "NZ"; }
    else if ($rU =~ "^90")  { $var(country) = "TR"; }
    else if ($rU =~ "^41")  { $var(country) = "CH"; }
    else if ($rU =~ "^61")  { $var(country) = "AU"; }
    else if ($rU =~ "^54")  { $var(country) = "AR"; }
    else if ($rU =~ "^44")  { $var(country) = "GB"; }
    else if ($rU =~ "^49")  { $var(country) = "DE"; }
    else if ($rU =~ "^356") { $var(country) = "MT"; }
    else if ($rU =~ "^48")  { $var(country) = "PL"; }
    else if ($rU =~ "^31")  { $var(country) = "NL"; }
    else if ($rU =~ "^998") { $var(country) = "UZ"; }
    else if ($rU =~ "^7[67]") { $var(country) = "KZ"; }
    else if ($rU =~ "^7")   { $var(country) = "RU"; }
    else if ($rU =~ "^351") { $var(country) = "PT"; }
    else if ($rU =~ "^34")  { $var(country) = "ES"; }
    else if ($rU =~ "^33")  { $var(country) = "FR"; }
    else {
        xlog("L_WARN", "PROTON: Unknown destination prefix: $rU \n");
    }

    $var(dial_num) = $_s($env(PROTON_TECH_PREFIX)$rU);

    if ($var(country) == "RU") {
        uac_replace_from("793211111111", "sip:793211111111@$env(MY_PUBLIC_IP):5060");
        xlog("L_INFO", "PROTON RU: clid replaced to 793211111111");
    }

    xlog("L_INFO", "PROTON via Asterisk AMD: src=$var(source) country=$var(country) dst=$rU dial_num=$var(dial_num)");

    append_hf("X-Real-Dst: proton\r\n");
    append_hf("X-Provider-Dst: $env(PROTON_GW_IP)\r\n");
    append_hf("X-Dial-Num: $var(dial_num)\r\n");
    append_hf("X-ElevenLabs-CallID: $dlg_var(elevenlabs_call_id)\r\n");
    append_hf("X-Tech-Prefix: $env(PROTON_TECH_PREFIX)\r\n");

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    $du = "sip:164.92.147.163:5080;transport=udp";

    t_on_failure("FAIL_ASTERISK");

    route(RELAY);
}

