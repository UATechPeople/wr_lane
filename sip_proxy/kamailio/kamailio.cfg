#!KAMAILIO

####### Defined Values #########

#!define MULTIDOMAIN 0

#!define FLT_ACC 1
#!define FLT_ACCMISSED 2
#!define FLT_ACCFAILED 3

#!define WEBHOOK_URL "https://core.example.com/webhook/calls"

####### Antifraud #########

# Only Voice AI' SIP trunk is allowed to place new calls; everything else
# reaching us out-of-dialog is scanner/spam traffic.
#!define TRUSTED_SIP_SUBNETS "192.0.2.0/24"

# Flood threshold: sustained >20 req/2s from one source gets banned.
#!define PIKE_SAMPLING_UNIT 2
#!define PIKE_REQS_DENSITY 20
#!define PIKE_REMOVE_LATENCY 120

# Repeated bad API keys from an otherwise-trusted source get banned too.
# (Ban duration itself is hardcoded to 86400 at each sht_setxs() call site:
# #!define tokens aren't substituted inside already-quoted strings.)
#!define APIKEY_FAIL_THRESHOLD 5

####### Env Vars #########

#!defenvs DB_URL
#!defenv MY_PUBLIC_IP

####### Network #########

listen=udp:0.0.0.0:5060 advertise MY_PUBLIC_IP:5060
listen=tcp:0.0.0.0:5060 advertise MY_PUBLIC_IP:5060
alias=MY_PUBLIC_IP

disable_tcp=no
tcp_accept_no_cl=yes

####### Global Parameters #########

debug=2
log_stderror=yes
log_prefix="{$mt $hdr(CSeq) $ci} "
children=2

####### Modules Section ########

loadmodule "xlog.so"
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
loadmodule "sanity.so"
loadmodule "dialog.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "uac.so"
loadmodule "http_client.so"
loadmodule "jansson.so"
loadmodule "db_sqlite.so"
loadmodule "pv.so"
loadmodule "ipops.so"
loadmodule "pike.so"
loadmodule "htable.so"

####### Module Parameters ########

modparam("dialog", "db_url", DB_URL)
modparam("dialog", "dlg_flag", 10)

modparam("http_client", "connection_timeout", 2000)

modparam("uac", "auth_username_avp", "$avp(uac_user)")
modparam("uac", "auth_password_avp", "$avp(uac_pass)")
modparam("uac", "auth_realm_avp", "$avp(uac_realm)")

modparam("pike", "sampling_time_unit", PIKE_SAMPLING_UNIT)
modparam("pike", "reqs_density_per_unit", PIKE_REQS_DENSITY)
modparam("pike", "remove_latency", PIKE_REMOVE_LATENCY)

modparam("htable", "db_url", DB_URL)
# Persistent ban list (survives restarts, backed by the sqlite DB_URL).
# db_expires=1 is required so a ban's TTL survives the round-trip through the
# DB too -- otherwise reloaded bans come back with expires=0, i.e. permanent.
modparam("htable", "db_expires", 1)
# autoexpire (86400s) matches the ban duration used in sht_setxs() calls below.
modparam("htable", "htable", "ipban=>size=8;autoexpire=86400;dbtable=htable_ipban;dbmode=1;")
# Short-lived counter of bad-API-key attempts, per source IP (in-memory only).
modparam("htable", "htable", "apikeyfail=>size=8;autoexpire=300;")

####### Routing Logic ########

route {
    xlog("L_INFO", "MainRoute: [$ci] FROM $fu TO $ru src=$si:$sp");

    route(REQINIT);

    if (is_method("CANCEL")) {
        if (t_check_trans())
            t_relay();
        exit;
    }

    if (!is_method("ACK")) {
        if(t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    route(WITHINDLG);

    remove_hf("Route");

    # Everything past this point is a new (out-of-dialog) request. The only
    # legitimate source is the Voice AI SIP trunk -- anything else is
    # scanner/spam traffic and gets dropped silently.
    if (!is_in_subnet("$si", TRUSTED_SIP_SUBNETS)) {
        xlog("L_WARN", "ANTIFRAUD: untrusted source $si:$sp rm=$rm -> drop\n");
        drop();
    }

    if (is_method("INVITE")) {
        dlg_manage();
        $dlg_var(caller)      = $fU;
        $dlg_var(callee)      = $rU;
        $dlg_var(invite_time) = $TS;

        if ($hdr(Call-ID) != $null) {
            $dlg_var(voiceai_call_id) = $hdr(Call-ID);
            xlog("L_INFO", "MainRoute: Voice AI Call-ID=$dlg_var(voiceai_call_id)");
        }

        record_route();
        setflag(FLT_ACC);
        setflag(10);
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    if (!is_present_hf("X-API-Key")) {
        xlog("L_WARN", "Missing X-API-Key from $si:$sp\n");
        route(APIKEY_FAIL);
        sl_send_reply("403", "Forbidden - Missing Token");
        exit;
    }

    if ($hdr(X-API-Key) == $env(VOICEAI_CARRIER_C_TOKEN)) {
        xlog("L_INFO", "RealCall - CARRIER_C src=$si dst=$rU");
        $var(source)         = "VOICEAI";
        $avp(acc_provider)   = "carrier_c";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "carrier_c";
        route(DETOKENIZE);
        route(CARRIER_C);
    }

    if ($hdr(X-API-Key) == $env(VOICEAI_CARRIER_A_TOKEN)) {
        xlog("L_INFO", "RealCall - CARRIER_A src=$si dst=$rU");
        $var(source)         = "VOICEAI";
        $avp(acc_provider)   = "carrier_a";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "carrier_a";
        route(DETOKENIZE);
        route(CARRIER_A);
    }

    if ($hdr(X-API-Key) == $env(VOICEAI_CARRIER_B_TOKEN)) {
        xlog("L_INFO", "RealCall - CARRIER_B src=$si dst=$rU");
        $var(source)         = "VOICEAI";
        $avp(acc_provider)   = "carrier_b";
        $avp(acc_callee)     = $rU;
        $dlg_var(provider)   = "carrier_b";
        route(DETOKENIZE);
        route(CARRIER_B);
    }

    xlog("L_WARN", "Unknown API key from $si\n");
    route(APIKEY_FAIL);
    sl_send_reply("403", "Forbidden - Invalid Token");
    exit;
}

# Tracks repeated bad/missing API keys from a single source and bans it
# once the threshold is crossed, even though it's within the trusted subnet.
route[APIKEY_FAIL] {
    $var(apikeyfail_count) = $shtinc(apikeyfail=>$si);
    if ($var(apikeyfail_count) >= APIKEY_FAIL_THRESHOLD) {
        xlog("L_ALERT", "ANTIFRAUD: banning $si after repeated bad API keys\n");
        sht_setxs("ipban", "$si", "badkey", "86400");
    }
}

# Per SIP request initial checks
route[REQINIT] {
    xlog("L_NOTICE", "REQINIT: $rm from $si");

    # Ban/flood enforcement never applies to our own known infra (the
    # Voice AI trunk and the 3 outbound gateways) -- they can legitimately
    # send in-dialog traffic (ACK/BYE/replies) at high volume under load, and
    # a false-positive ban here would take down real calls for 24h.
    if (!is_in_subnet("$si", TRUSTED_SIP_SUBNETS)
            && $si != $env(CARRIER_C_GW_IP)
            && $si != $env(CARRIER_A_GW_IP)
            && $si != $env(CARRIER_B_GW_IP)) {

        # Already-banned sources get dropped before any other processing.
        if ($sht(ipban=>$si) != $null) {
            drop();
        }

        # Flood detection: bans sources that exceed the configured request rate.
        if (!pike_check_req()) {
            xlog("L_ALERT", "ANTIFRAUD: flood detected from $si, banning\n");
            sht_setxs("ipban", "$si", "flood", "86400");
            drop();
        }
    }

    if ($ua =~ "friendly-scanner|sipcli|VaxSIPUserAgent|pplsip") {
        drop();
    }

    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("L_WARN", "Malformed SIP from $si:$sp\n");
        exit;
    }
}

route[RELAY] {
    xlog("L_INFO", "RELAY: [$ci] and $ru");

    if (is_method("INVITE")) {
        t_on_reply("MANAGE_REPLY");
        if (!t_is_set("failure_route")) {
            t_on_failure("MANAGE_FAILURE");
        }
    }

    if (!t_relay()) {
        sl_reply_error();
    }

    exit;
}

route[WITHINDLG] {
    xlog("L_INFO", "WITHINDLG: [$ci] $rm from $si");

    if (!has_totag()) return;
    dlg_manage();

    if (loose_route()) {
        if (is_method("BYE")) {
            setflag(FLT_ACC);
            setflag(FLT_ACCFAILED);
            $avp(acc_status) = "success";
        } else if (is_method("NOTIFY")) {
            xlog("L_INFO", "NOTIFY from $si:$sp");
        }
        route(RELAY);
        exit;
    }

    if (is_method("ACK")) {
        if (t_check_trans()) {
            route(RELAY);
            exit;
        } else {
            exit;
        }
    }

    sl_send_reply("404", "Not here");
    exit;
}

# GET http://cabinet:3501/detokenize?t=<token>

route[DETOKENIZE] {
    if (!is_method("INVITE")) return;

    t_reply("100", "Trying");

    $var(detoken_url) = $_s($env(DETOKEN_URL)?t=$rU);
    xlog("L_INFO", "DETOKENIZE: GET $var(detoken_url)");

    $var(http_rc) = http_client_query("$var(detoken_url)", "",
        "X-Decrypt-Key: $env(DECRYPT_KEY)",
        "$var(json_resp)");

    if ($var(http_rc) == 200) {
        jansson_get("phone", $var(json_resp), "$var(real_phone)");

        if ($var(real_phone) == $null || $var(real_phone) == "") {
            xlog("L_ERR", "DETOKENIZE: empty phone in response for token=$rU resp=$var(json_resp)\n");
            sl_send_reply("603", "Declined");
            exit;
        }

        xlog("L_INFO", "DETOKENIZE: token=$rU phone=$var(real_phone)");
        $rU = $var(real_phone);
        $dlg_var(callee) = $rU;

    } else {
        xlog("L_ERR", "DETOKENIZE: HTTP error=$var(http_rc) token=$rU\n");
        sl_send_reply("603", "Declined");
        exit;
    }
}

route[CARRIER_C] {
    if ($rU =~ "^64")         { $var(country) = "NZ"; }
    else if ($rU =~ "^90")    { $var(country) = "TR"; }
    else if ($rU =~ "^41")    { $var(country) = "CH"; }
    else if ($rU =~ "^61")    { $var(country) = "AU"; }
    else if ($rU =~ "^54")    { $var(country) = "AR"; }
    else if ($rU =~ "^44")    { $var(country) = "GB"; }
    else if ($rU =~ "^49")    { $var(country) = "DE"; }
    else if ($rU =~ "^356")   { $var(country) = "MT"; }
    else if ($rU =~ "^48")    { $var(country) = "PL"; }
    else if ($rU =~ "^31")    { $var(country) = "NL"; }
    else if ($rU =~ "^998")   { $var(country) = "UZ"; }
    else if ($rU =~ "^7[67]") { $var(country) = "KZ"; }
    else if ($rU =~ "^7")     { $var(country) = "RU"; }
    else if ($rU =~ "^351")   { $var(country) = "PT"; }
    else if ($rU =~ "^34")    { $var(country) = "ES"; }
    else if ($rU =~ "^33")    { $var(country) = "FR"; }

    $var(dial_num) = $_s($env(CARRIER_C_TECH_PREFIX)$rU);
    $var(ru_str)   = $_s(sip:$var(dial_num)@$env(CARRIER_C_GW_IP):$env(CARRIER_C_GW_PORT));

    xlog("L_INFO", "CARRIER_C: country=$var(country) dst=$rU dial=$var(dial_num) gw=$env(CARRIER_C_GW_IP):$env(CARRIER_C_GW_PORT)");

    $ru = $var(ru_str);
    uac_replace_to($var(ru_str));

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    route(RELAY);
}

route[CARRIER_A] {
    if ($rU =~ "^64")         { $var(country) = "NZ"; }
    else if ($rU =~ "^90")    { $var(country) = "TR"; }
    else if ($rU =~ "^41")    { $var(country) = "CH"; }
    else if ($rU =~ "^61")    { $var(country) = "AU"; }
    else if ($rU =~ "^54")    { $var(country) = "AR"; }
    else if ($rU =~ "^44")    { $var(country) = "GB"; }
    else if ($rU =~ "^49")    { $var(country) = "DE"; }
    else if ($rU =~ "^356")   { $var(country) = "MT"; }
    else if ($rU =~ "^48")    { $var(country) = "PL"; }
    else if ($rU =~ "^31")    { $var(country) = "NL"; }
    else if ($rU =~ "^998")   { $var(country) = "UZ"; }
    else if ($rU =~ "^7[67]") { $var(country) = "KZ"; }
    else if ($rU =~ "^351")   { $var(country) = "PT"; }
    else if ($rU =~ "^34")    { $var(country) = "ES"; }
    else if ($rU =~ "^33")    { $var(country) = "FR"; }
    else {
        xlog("L_WARN", "CARRIER_A: unknown prefix $rU\n");
    }

    $var(ru_str) = $_s(sip:$rU@$env(CARRIER_A_GW_IP):$env(CARRIER_A_GW_PORT));

    xlog("L_INFO", "CARRIER_A: country=$var(country) dst=$rU gw=$env(CARRIER_A_GW_IP):$env(CARRIER_A_GW_PORT)");

    $ru = $var(ru_str);
    uac_replace_to($var(ru_str));
    uac_replace_from("$env(CARRIER_A_AUTH_USER)", "sip:$env(CARRIER_A_AUTH_USER)@$env(MY_PUBLIC_IP):5060");

    $avp(uac_user)  = $env(CARRIER_A_AUTH_USER);
    $avp(uac_pass)  = $env(CARRIER_A_AUTH_PASS);
    $avp(uac_realm) = "";

    remove_hf("X-API-Key");
    remove_hf("X-Provider-Name");

    t_on_failure("MANAGE_FAILURE");

    route(RELAY);
}

