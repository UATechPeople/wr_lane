route[CDR_WEBHOOK] {
    if ($dlg_var(answer_time) != $null) {
        $var(duration) = $TS - $dlg_var(answer_time);
    } else {
        $var(duration) = 0;
    }

    if ($dlg_var(answer_time) != $null && $dlg_var(invite_time) != $null) {
        $var(setuptime) = $dlg_var(answer_time) - $dlg_var(invite_time);
    } else {
        $var(setuptime) = 0;
    }

    $var(status) = $avp(acc_status);
    if ($var(status) == $null) {
        $var(status) = "failed";
    }

    $var(sip_code) = $(rs{s.substr,0,3});
    xlog("L_INFO", "CDR_WEBHOOK sip_code raw=$rs sip_code_cut=$var(sip_code)");
    xlog("L_INFO", "CDR_WEBHOOK body=$var(cdr_body)");


    $var(cdr_body) = $_s({"callid":"$ci","method":"BYE","from_tag":"$ft","to_tag":"$tt","sip_code":"$var(sip_code)","sip_reason":"$rr","caller":"sip:$fU@$fd","callee":"sip:$dlg_var(callee)@$rd","provider":"$dlg_var(provider)","src_ip":"$si","duration":$var(duration),"setuptime":$var(setuptime),"status":"$var(status)"});

    http_client_query(WEBHOOK_URL, "$var(cdr_body)", "Content-Type: application/json\r\nAuthorization: Bearer $env(WEBHOOK_KEY)", "$var(wh_reply)");

    xlog("L_INFO", "CDR_WEBHOOK: callid=$ci elevenlabs_call_id=$dlg_var(elevenlabs_call_id) provider=$dlg_var(provider) duration=$var(duration) setuptime=$var(setuptime) status=$var(status) reply=$var(wh_reply)");
}


onreply_route[MANAGE_REPLY] {
    xlog("L_INFO","Route_on_reply: [$ci] status=$rs");

    if ($rs =~ "^2[0-9][0-9]") {
        $dlg_var(answer_time) = $TS;
        $avp(acc_status) = "answered";
    } else if ($rs =~ "^486") {
        $avp(acc_status) = "busy";
    } else if ($rs =~ "^4[0-9][0-9]") {
        $avp(acc_status) = "failed";
    }












