route[CDR_WEBHOOK] {
    if ($dlg_var(answer_time) != $null) {
        $var(duration) = $TS - $dlg_var(answer_time);
    } else {
        $var(duration) = 0;
    }

    if ($dlg_var(answer_time) != $null && $dlg_var(invite_time) != $null) {
        $var(setuptime) = $dlg_var(answer_time) - $dlg_var(invite_time);
    } else {
        $var(setuptime) = 0;
    }

    $var(status) = $avp(acc_status);
    if ($var(status) == $null) {
        $var(status) = "failed";
    }

    $var(cdr_body) = $_s({"callid":"$ci","from_tag":"$ft","to_tag":"$tt","caller":"$fU","callee":"$dlg_var(callee)","provider":"$dlg_var(provider)","voiceai_call_id":"$dlg_var(voiceai_call_id)","duration":$var(duration),"setuptime":$var(setuptime),"status":"$var(status)"});

    http_client_query(WEBHOOK_URL, "$var(cdr_body)",
        "Content-Type: application/json\r\nAuthorization: Bearer $env(WEBHOOK_KEY)",
        "$var(wh_reply)");

    xlog("L_INFO", "CDR_WEBHOOK: callid=$ci provider=$dlg_var(provider) duration=$var(duration) status=$var(status) reply=$var(wh_reply)");
}

onreply_route[MANAGE_REPLY] {
    xlog("L_INFO", "MANAGE_REPLY: [$ci] status=$rs");

    if ($rs =~ "^2[0-9][0-9]") {
        $dlg_var(answer_time) = $TS;
        $avp(acc_status)      = "answered";
    } else if ($rs =~ "^486") {
        $avp(acc_status) = "busy";
    } else if ($rs =~ "^4[0-9][0-9]") {
        $avp(acc_status) = "failed";
    }
}

failure_route[MANAGE_FAILURE] {
    if (t_is_canceled()) {
        $avp(acc_status) = "no answer";
        setflag(FLT_ACCMISSED);
        exit;
    }
    if (t_check_status("401|407")) {
        uac_auth();
        t_relay();
        exit;
    }
    $avp(acc_status) = "failed";
}