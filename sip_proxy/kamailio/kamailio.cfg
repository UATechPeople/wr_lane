disable_tcp=no
tcp_accept_no_cl=yes

####### Global Parameters #########

debug=2
log_stderror=yes
log_prefix="{$mt $hdr(CSeq) $ci} "
children=2

####### Modules Section ########

loadmodule "xlog.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "rr.so"
loadmodule "maxfwd.so"
