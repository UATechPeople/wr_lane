####### Routing Logic ########



route {

    xlog("L_INFO","MainRoute: [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");

    # per request initial checks
    route(REQINIT);

    # CANCEL processing
    if (is_method("CANCEL"))
    {
        xlog("L_INFO","MainRoute: is_method_CANCEL [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
        if (t_check_trans())
            xlog("L_INFO","MainRoute: t_relay [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
            t_relay();
        exit;
    }

    # handle retransmissions
    if (!is_method("ACK")) {
           xlog("L_INFO","MainRoute: not is_method_ACK [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
           if(t_precheck_trans()) {
                  xlog("L_INFO","MainRoute: t_precheck_trans [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
                  t_check_trans();
                  exit;
           }
           t_check_trans();
    }

    # handle requests within SIP dialogs
    route(WITHINDLG);

    # record routing for dialog forming requests (in case they are routed)
    # - remove preloaded route headers
    remove_hf("Route");


	if(is_method("INVITE")) {
        xlog("L_INFO","MainRoute: dlg_manage [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
        dlg_manage();
         $dlg_var(caller) = $fU;
         $dlg_var(callee) = $rU;
         $dlg_var(invite_time) = $TS;

         if ($hdr(Call-ID) != $null) {
        $dlg_var(elevenlabs_call_id) = $hdr(Call-ID);
        xlog("L_INFO","MainRoute: method INVITE [$ci] Call-ID from Eleven_Labs: $dlg_var(elevenlabs_call_id) ");
    }
        xlog("L_INFO","MainRoute: method INVITE [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
        xlog("L_INFO","MainRoute: record_route_adv [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
        record_route();

        setflag(FLT_ACC); # do accounting
        setflag(10); # set the dialog flag
        setflag(11); # Set the sst flag
	}

    if(is_method("OPTIONS"))
    {
        # reply on SIP OPTIONS
	sl_send_reply("200","OK");
        exit;
    }

    if($si == "44.229.228.186" || $si == "44.238.177.138"){
        xlog("L_INFO","RealCall Started");
        $var(provider) = "VAPI_MMD";
        $var(source) = "VAPI";

        $avp(acc_provider) = "Proton_VAPI";
        $avp(acc_callee)   = $rU;

        route(MMD);
    }
    if ($si == $env(MY_PUBLIC_IP) && $sp == 5080) {
       xlog("L_INFO","MainRoute: from Asterisk $si:$sp ci=$ci\n");
       route(WITHINDLG);
       exit;
  }

    if (!is_present_hf("X-API-Key")) {
        xlog("L_WARN", "request Checking Custom Headers: X-API-Key. There are no such header. 403 Forbidden | method=$rm | from=$fu | to=$tu | src=$si:$sp\n");
        sl_send_reply("403", "Forbidden - Missing Token");
        exit;
    }

    if($hdr(X-API-Key) == $env(ELEVEN_LAB_PROFITEL_TOKEN)) {
    xlog("L_INFO","RealCall Started - Profitel via Asterisk AMD");
    $var(provider) = "Profitel";
    $var(source) = "ELEVEN_LAB";
    $avp(acc_provider) = $hdr(X-Provider-Name);
    $avp(acc_callee)   = $rU;
    $dlg_var(provider) = "Profitel";
    append_hf("X-ElevenLabs-CallID: $dlg_var(elevenlabs_call_id)\r\n");
    route(PROFITEL);
}

     if($hdr(X-API-Key) == $env(ELEVEN_LAB_PROTON_TOKEN)){
        xlog("L_INFO","RealCall Started");
        $var(provider)    = $hdr(X-Provider-Name);
        $var(source) = "ELEVEN_LAB";

        $avp(acc_provider) = $hdr(X-Provider-Name);
        $avp(acc_callee)   = $rU;

         $dlg_var(provider) = $hdr(X-Provider-Name);

        route(PROTON);
     }

    if($hdr(X-API-Key) == $env(ELEVEN_LAB_DID_GLOBAL_TOKEN)){
        xlog("L_INFO","RealCall Started");
        $var(provider) = $hdr(X-Provider-Name);
        $var(source) = "ELEVEN_LAB";

        $avp(acc_provider) = $hdr(X-Provider-Name);
        $avp(acc_callee)   = $rU;

        $dlg_var(provider) = $hdr(X-Provider-Name);

        route(DIDGLOBAL);

    }
  if($hdr(X-API-Key) == $env(ELEVEN_LAB_MMD_TOKEN)) {
        xlog("L_INFO","RealCall Started");
        $var(provider) = $hdr(X-Provider-Name);
        $var(source) = "ELEVEN_LAB";





        $avp(acc_provider) = $hdr(X-Provider-Name);
        $avp(acc_callee)   = $rU;

        $dlg_var(provider) = $hdr(X-Provider-Name);

        route(MMD);
    }

    if($hdr(X-API-Key) == $env(ELEVEN_LAB_SIPPER_TOKEN)){
        xlog("L_INFO","RealCall Started");
        $var(provider) = $hdr(X-Provider-Name);
        $var(source) = "ELEVEN_LAB";

        $avp(acc_provider) = $hdr(X-Provider-Name);
        $avp(acc_callee)   = $rU;

        $dlg_var(provider) = $hdr(X-Provider-Name);

        route(SIPPER);
    }



        xlog("L_WARN", "Unknown API key: $hdr(X-API-Key) from $si\n");
        sl_send_reply("403", "Forbidden - Invalid Token");
        exit;

}




# Per SIP request initial checks
route[REQINIT] {

       # if($sht(ipban=>$si) != $null) {
       # xlog("L_WARN", "REQINIT: Banned IP $si");
       # drop();
       # }

    # pike - rate limiting
    #if(!is_in_subnet("$si", "199.88.252.0/24")){
    #    xlog("L_WARN", "REQINIT: IP ADDRESS NOT IN ALLOWED SUBNET Pike blocking $si - adding to ipban");
    #     if(!pike_check_req()) {
    #        xlog("L_WARN", "REQINIT: Pike blocking $si - adding to ipban");
    #        $sht(ipban=>$si) = 1;
    #        sl_send_reply("429", "Too Many Requests");
    #        exit;
    #    }



	xlog("L_NOTICE", "request in REQINIT for $rm from $si");
	if($ua =~ "friendly-scanner|sipcli|VaxSIPUserAgent|pplsip") {
		   #$sht(ipban=>$si) = 1;
                   drop();
	}

	if (!mf_process_maxfwd_header("10")) {
		sl_send_reply("483", "Too Many Hops");
		exit;
	}

	if(!sanity_check("1511", "7")) {
		xlog("Malformed SIP message from $si:$sp\n");
		exit;
	}
}

route[RELAY] {
        xlog("L_INFO","RouteRELAY: [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");

	if (is_method("INVITE")) {
		t_on_reply("MANAGE_REPLY");
                #remove_hf("User-Agent");
                #append_hf("User-Agent: SERVER_HEADER\r\n");
                xlog("L_INFO","RouteRELAY: Source $var(source) Redirecting to $var(provider) [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
		if(!t_is_set("failure_route")) {
                        xlog("L_INFO","RouteRELAY: is_method_INVITE Setting failure route [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
			t_on_failure("MANAGE_FAILURE");
		}
	}

	if (!t_relay()) {
		sl_reply_error();
	}

	exit;
}

route[WITHINDLG] {
        xlog("L_INFO","RouteWITHINDLG: [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");

	if (!has_totag()) return;
    dlg_manage();

	# sequential request withing a dialog should
	# take the path determined by record-routing
	if (loose_route()) {
                xlog("L_INFO","RouteWITHINDLG: loose_route [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
		if (is_method("BYE")) {
                        xlog("L_INFO","RouteWITHINDLG: is_method_BYE [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
			setflag(FLT_ACC); # do accounting ...
			setflag(FLT_ACCFAILED); # ... even if the transaction fails
            $avp(acc_status) = "success";
                        route(CDR_WEBHOOK);
              } else if ( is_method("ACK") ) {
    if ($dlg_var(provider) == "Profitel" || $dlg_var(provider) == "didglobal"
    || $dlg_var(provider) == "mmd" || $dlg_var(provider) == "proton") {
    $du = "sip:164.92.147.163:5080;transport=udp";
}
        forward();
        exit;
		} else if ( is_method("NOTIFY") ) {
			xlog("L_INFO","NOTIFY from $si:$sp");
			# Add Record-Route for in-dialog NOTIFY as per RFC 6665.
			#record_route();
		}
                xlog("L_INFO","RouteWITHINDLG: go to route RELAY [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
		route(RELAY);
		exit;
	}

	if ( is_method("ACK") ) {
                xlog("L_INFO","RouteWITHINDLG: is_method_ACK [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
		if ( t_check_trans() ) {
			# no loose-route, but stateful ACK;
			# must be an ACK after a 487
			# or e.g. 404 from upstream server
                        xlog("L_INFO","RouteWITHINDLG: is_method_ACK t_check_trans [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
			route(RELAY);
			exit;
		} else {
                        xlog("L_INFO","RouteWITHINDLG: is_method_ACK not t_check_trans [$ci] FROM ip:$fd cid:$fn tag:$ft TO ip:$rd dst:$rU");
			# ACK without matching transaction ... ignore and discard
			exit;
		}
	}
	sl_send_reply("404","Not here");
	exit;
}

