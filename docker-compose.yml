services:
  cabinet:
    build: .
    image: ghcr.io/uatechpeople/wr_lane-cabinet:latest
    ports:
      - "3500:3500"
    environment:
      PORT: 3500
      FF3_KEY: ${FF3_KEY:?set FF3_KEY in .env}
      FF3_TWEAK: ${FF3_TWEAK:-D8E7920AFA330A73}
      ROUTE_DIGIT: ${ROUTE_DIGIT:-9}
      DECRYPT_KEY: ${DECRYPT_KEY:?set DECRYPT_KEY in .env}
      CABINET_USER: ${CABINET_USER:-admin}
      CABINET_PASSWORD: ${CABINET_PASSWORD:?set CABINET_PASSWORD in .env}
      INTERNAL_HOST: 0.0.0.0
      INTERNAL_PORT: 3501
      CLIENT_PREFIX: ${CLIENT_PREFIX:-}
      WR_BASE_URL: ${WR_BASE_URL:-}
      WR_SLUG: ${WR_SLUG:-}
      WR_API_KEY: ${WR_API_KEY:-}
      WR_PLAYER_SEGMENT: ${WR_PLAYER_SEGMENT:-hidden_base}
      DB_PATH: /data/cabinet.sqlite
    volumes:
      - cabinet-data:/data
    restart: unless-stopped

  kamailio:
      build:
        context: ./sip_proxy
        dockerfile: docker/Dockerfile
      image: ghcr.io/uatechpeople/wr_lane-kamailio:latest
      ports:
        - "5060:5060/udp"
        - "5060:5060/tcp"
      environment:
        MY_PUBLIC_IP: ${MY_PUBLIC_IP:?set MY_PUBLIC_IP in .env}
        DECRYPT_KEY: ${DECRYPT_KEY:?set DECRYPT_KEY in .env}
        WEBHOOK_KEY: ${WEBHOOK_KEY:?set WEBHOOK_KEY in .env}
        DB_URL: ${DB_URL:-sqlite:///var/lib/kamailio/kamailio.db}
        DETOKEN_URL: ${DETOKEN_URL:-http://cabinet:3501/detokenize}
        ELEVEN_LAB_PROTON_TOKEN: ${ELEVEN_LAB_PROTON_TOKEN:?set ELEVEN_LAB_PROTON_TOKEN in .env}
        ELEVEN_LAB_MMD_TOKEN: ${ELEVEN_LAB_MMD_TOKEN:?set ELEVEN_LAB_MMD_TOKEN in .env}
        ELEVEN_LAB_DIDGLOBAL_TOKEN: ${ELEVEN_LAB_DIDGLOBAL_TOKEN:?set ELEVEN_LAB_DIDGLOBAL_TOKEN in .env}
        PROTON_GW_IP: ${PROTON_GW_IP:?set PROTON_GW_IP in .env}
        PROTON_GW_PORT: ${PROTON_GW_PORT:-5060}
        PROTON_TECH_PREFIX: ${PROTON_TECH_PREFIX:?set PROTON_TECH_PREFIX in .env}
        MMD_GW_IP: ${MMD_GW_IP:?set MMD_GW_IP in .env}
        MMD_GW_PORT: ${MMD_GW_PORT:-5060}
        MMD_AUTH_USER: ${MMD_AUTH_USER:?set MMD_AUTH_USER in .env}
        MMD_AUTH_PASS: ${MMD_AUTH_PASS:?set MMD_AUTH_PASS in .env}
        DIDGLOBAL_GW_IP: ${DIDGLOBAL_GW_IP:?set DIDGLOBAL_GW_IP in .env}
        DIDGLOBAL_GW_PORT: ${DIDGLOBAL_GW_PORT:-5060}
      depends_on:
        - cabinet
      restart: unless-stopped

volumes:
  cabinet-data:
