name: build-and-push

# Builds the cabinet + kamailio images in CI and pushes them to GitHub Container
# Registry (ghcr.io). The droplet only pulls these — it never builds (1 vCPU / ~1GB).

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: cabinet
            context: .
            dockerfile: ./Dockerfile
          - name: kamailio
            context: ./sip_proxy
            dockerfile: ./sip_proxy/docker/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/uatechpeople/wr_lane-${{ matrix.name }}:latest
            ghcr.io/uatechpeople/wr_lane-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
