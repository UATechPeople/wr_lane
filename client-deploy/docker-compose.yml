# Hidden Numbers — client self-host. Pull-only: images come from our registry,
# there is no source code here. Run ./up.sh (it logs in, pulls, and starts).
services:
  cabinet:
    image: ghcr.io/uatechpeople/wr_lane-cabinet:latest
    platform: linux/amd64
    env_file:
      - path: keys.env
        required: false
    ports:
      - "3500:3500"
    environment:
      PORT: 3500
      FF3_KEY: ${FF3_KEY:-}
      FF3_TWEAK: ${FF3_TWEAK:-D8E7920AFA330A73}
      ROUTE_DIGIT: ${ROUTE_DIGIT:-9}
      DECRYPT_KEY: ${DECRYPT_KEY:-}
      CABINET_USER: ${CABINET_USER:-admin}
      CABINET_PASSWORD: ${CABINET_PASSWORD:-}
      INTERNAL_HOST: 0.0.0.0
      INTERNAL_PORT: 3501
      CLIENT_PREFIX: ${CLIENT_PREFIX:?set CLIENT_PREFIX in .env}
      WR_BASE_URL: ${WR_BASE_URL:-}
      WR_SLUG: ${WR_SLUG:-}
      WR_API_KEY: ${WR_API_KEY:-}
      WR_PLAYER_SEGMENT: ${WR_PLAYER_SEGMENT:-hidden_base}
      WR_EVENT_TYPE: ${WR_EVENT_TYPE:-player.registered}
      WR_COHORT: ${WR_COHORT:-}
      DB_PATH: /data/cabinet.sqlite
    volumes:
      - cabinet-data:/data
    restart: unless-stopped

  kamailio:
    image: ghcr.io/uatechpeople/wr_lane-kamailio:latest
    platform: linux/amd64
    env_file:
      - path: keys.env
        required: false
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    environment:
      MY_PUBLIC_IP: ${MY_PUBLIC_IP:-}
      DECRYPT_KEY: ${DECRYPT_KEY:-}
      DB_URL: ${DB_URL:-sqlite:///var/lib/kamailio/kamailio.db}
      DETOKEN_URL: ${DETOKEN_URL:-http://cabinet:3501/detokenize}
      TRUNK_IPAUTH_API_KEY: ${TRUNK_IPAUTH_API_KEY:-placeholder}
      TRUNK_DIGEST_API_KEY: ${TRUNK_DIGEST_API_KEY:-placeholder}
      TRUNK_DIRECT_API_KEY: ${TRUNK_DIRECT_API_KEY:-placeholder}
      TRUNK_IPAUTH_HOST: ${TRUNK_IPAUTH_HOST:-127.0.0.1}
      TRUNK_IPAUTH_PORT: ${TRUNK_IPAUTH_PORT:-5060}
      TRUNK_IPAUTH_PREFIX: ${TRUNK_IPAUTH_PREFIX:-}
      TRUNK_DIGEST_HOST: ${TRUNK_DIGEST_HOST:-}
      TRUNK_DIGEST_PORT: ${TRUNK_DIGEST_PORT:-5060}
      TRUNK_DIGEST_USER: ${TRUNK_DIGEST_USER:-}
      TRUNK_DIGEST_PASS: ${TRUNK_DIGEST_PASS:-}
      TRUNK_DIRECT_HOST: ${TRUNK_DIRECT_HOST:-127.0.0.1}
      TRUNK_DIRECT_PORT: ${TRUNK_DIRECT_PORT:-5060}
    entrypoint: ["/usr/bin/stdbuf", "-oL", "-eL", "/entrypoint.sh"]
    depends_on:
      - cabinet
      - rtpengine
    restart: unless-stopped

  rtpengine:
    image: drachtio/rtpengine:latest
    platform: linux/amd64
    network_mode: host
    command:
      - rtpengine
      - --interface=${RTPENGINE_INTERFACE}
      - --listen-ng=172.28.0.1:22222
      - --listen-http=172.28.0.1:8080
      - --port-min=${RTP_PORT_MIN:-30000}
      - --port-max=${RTP_PORT_MAX:-30500}
      - --log-level=5
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1

volumes:
  cabinet-data:
